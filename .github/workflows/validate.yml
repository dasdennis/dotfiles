name: validate

on: [push, pull_request]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install stow shellcheck; else sudo apt-get update -qq && sudo apt-get install -y stow shellcheck; fi
      - name: Lint Shell Scripts
        run: shellcheck bin/install

      - name: Stow Dry-Run
        run: DOTFILES_TARGET="$(mktemp -d)" bin/install --dry-run
