[tools]
gh = "latest"
node = "26.12.0"
ruby = "3.4"

# [tools."npm:opencode-ai"]
# version = "1.18.14"
# allowed_scripts = ["opencode-ai"]

[settings]
# Performance optimizations for ThinkPad
jobs = 8                     # Parallel installs (i7-1365U has 12 threads)
http_timeout = "60s"           # default 30s; larger tarballs on slow links
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["ruby"]
raw = false                  # Keep output clean unless debugging
experimental = true          # Enable new providers
verbose = false              # Keep output clean unless debugging
always_keep_download = false # Save SSD space
always_keep_install = false  # Save SSD space

[settings.ruby]
compile = true

[env]
EDITOR = "nvim"
KUBE_EDITOR = "nvim"
# Skip ri/rdoc generation: saves build time and disk
RUBY_CONFIGURE_OPTS = "--disable-install-doc"

[tasks]
# Common development tasks (run with `mise run <task>`)
description = "Upgrade toolchains and prune unreferenced versions"
run = [
  "mise upgrade",
  "mise prune --yes",
]
